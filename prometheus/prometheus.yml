global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: enterprise-llm

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # vLLM engine + HTTP metrics (reached over the internal Docker network)
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  # Gateway connection / request counters (stub_status via exporter)
  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # GPU utilisation, VRAM, temperature, power, XID errors
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # Host CPU, memory, disk, network
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
