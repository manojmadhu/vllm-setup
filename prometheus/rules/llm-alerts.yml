# Alert rules for the enterprise vLLM stack.
# Metric names target vLLM V1 (v0.2x/v0.3x). If an expression returns no data,
# check http://127.0.0.1:9090 -> Graph for the names your version exposes.

groups:
  - name: availability
    rules:
      - alert: VLLMDown
        expr: up{job="vllm"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "vLLM is not responding to metric scrapes"
          description: "The inference server has been unreachable for 2 minutes. Check: docker compose logs vllm"

      - alert: GatewayDown
        expr: up{job="gateway"} == 0 or nginx_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "The Nginx LLM gateway is down"

      - alert: ScrapeTargetDown
        expr: up{job=~"dcgm|node|alertmanager"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Monitoring target {{ $labels.job }} is down"

  - name: inference
    rules:
      - alert: VLLMRequestQueueBacklog
        expr: max(vllm:num_requests_waiting) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Requests are queueing in vLLM"
          description: "{{ $value }} requests have been waiting for 5 minutes. The GPU is saturated; lower client rate limits or add capacity."

      - alert: VLLMKVCacheNearlyFull
        expr: max(vllm:kv_cache_usage_perc) > 0.95
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "KV cache above 95% for 10 minutes"
          description: "Long prompts or too many concurrent sequences. Requests may be preempted."

      - alert: VLLMHighTimeToFirstToken
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(vllm:time_to_first_token_seconds_bucket[5m]))) > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 time-to-first-token above 10s"

      - alert: VLLMHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="vllm", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="vllm"}[5m])), 1e-9) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "More than 5% of vLLM requests are failing with 5xx"

      - alert: VLLMRequestsPreempted
        expr: sum(increase(vllm:num_preemptions_total[15m])) > 20
        for: 0m
        labels: { severity: info }
        annotations:
          summary: "vLLM is preempting requests (KV cache pressure)"

  - name: gpu
    rules:
      - alert: GPUHighTemperature
        expr: max(DCGM_FI_DEV_GPU_TEMP) > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GPU temperature {{ $value }}°C"

      - alert: GPUXidErrors
        expr: max(DCGM_FI_DEV_XID_ERRORS) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "GPU reported XID error {{ $value }}"
          description: "Hardware/driver fault. Check dmesg and Azure resource health; the VM may need redeploying."

      - alert: GPUIdleWhileQueued
        expr: max(DCGM_FI_DEV_GPU_UTIL) < 5 and max(vllm:num_requests_waiting) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "GPU idle while requests are waiting — engine may be stuck"

  - name: host
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Less than 15% disk free on {{ $labels.mountpoint }}"

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Less than 10% RAM available on the GPU VM"

      - alert: HostHighCPU
        expr: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.90
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU above 90% for 15 minutes"
