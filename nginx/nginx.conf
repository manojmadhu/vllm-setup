user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    map_hash_bucket_size 128;   # long API-key strings in the map

    # Client API keys -> client name. Each line in keys.map looks like:
    #   "Bearer sk-llm-<random>"   rag-service;
    # Unknown or missing keys resolve to "" and are rejected with 401.
    map $http_authorization $api_client {
        default "";
        include /etc/nginx/api-keys/keys.map;
    }

    # Structured access log. The Authorization header is NEVER logged;
    # only the resolved client name ($api_client) is recorded.
    log_format llm_json escape=json
      '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"client":"$api_client",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"limit_req":"$limit_req_status",'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log /dev/stdout llm_json;

    # Only the gateway template is loaded (the image's default.conf is ignored).
    include /etc/nginx/conf.d/llm-*.conf;
}
